project:
  type: website
  output-dir: _site
  render: [index.qmd, publications.qmd, projects.qmd, supervisions.qmd, contact.qmd]
  resources: [about/, img/, publication-search.js]
website:
  title: "Viviane Hummes"
  site-url: https://vivianehummes.pages.dev
  description: "Site acadêmico de Viviane Hummes — Educação Matemática"
  favicon: img/favicon.ico
  search: true
  navbar:
    background: "#1e6dbb"
    foreground: "#ffffff"
    left:
      - href: index.qmd
        text: Sobre
        icon: house
      - href: publications.qmd
        text: Publicações
        icon: journal-text
      - href: projects.qmd
        text: Projetos
        icon: diagram-3
      - href: supervisions.qmd
        text: Orientações
        icon: people
      - href: contact.qmd
        text: Contato
        icon: envelope
    right:
      - icon: person-badge
        aria-label: ORCID
        href: https://orcid.org/0000-0003-2031-8238
  page-footer:
    border: true
    left: "© 2026 Viviane Hummes"
    right: "[ORCID](https://orcid.org/0000-0003-2031-8238)"
format:
  html:
    theme: cosmo
    css: quarto-style.css
    toc: false
    lang: pt-BR
    smooth-scroll: true
    anchor-sections: false
    title-block-banner: false
